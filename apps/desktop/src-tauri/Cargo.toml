[package]
name = "freedaw-desktop"
description = "FreeDAW desktop edition (Tauri v2 shell around engine-native)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
asio = ["engine-native/asio"]
jack = ["engine-native/jack"]

[dependencies]
assert_no_alloc = "1.1.2"
engine-core = { path = "../../../crates/engine-core", features = ["serde"] }
engine-native = { path = "../../../crates/engine-native" }
media = { path = "../../../crates/media" }
project = { path = "../../../crates/project" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens target="_blank" links in the default browser.
tauri-plugin-opener = "2"
tune = { path = "../../../crates/tune" }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
